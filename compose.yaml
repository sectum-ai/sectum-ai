# Local backends for Sectum AI integration tests.
# Usage: docker compose up -d   (then `uv run pytest`)
name: sectum

services:
  pgvector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: sectum
      POSTGRES_PASSWORD: sectum
      POSTGRES_DB: sectum
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sectum -d sectum"]
      interval: 2s
      timeout: 3s
      retries: 30

  # No healthcheck: the chroma image lacks a reliable in-container probe, so the
  # integration-test fixture retries the connection instead.
  chroma:
    image: chromadb/chroma:1.5.9
    ports:
      - "8001:8000"

  redis:
    image: redis:7.4-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The v4 Weaviate client needs both the HTTP (8080) and gRPC (50051) ports.
  # No healthcheck: the image ships no shell or curl, so the integration-test
  # fixture retries the connection instead.
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.28.4
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      QUERY_DEFAULTS_LIMIT: "25"
      CLUSTER_HOSTNAME: "node1"
    ports:
      - "8082:8080"
      - "50052:50051"

  # Qdrant serves HTTP on 6333 and gRPC on 6334; remapped to avoid local clashes.
  # No healthcheck: the image ships no shell, so the test fixture retries instead.
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6335:6333"
      - "6336:6334"

  # Phoenix serves its UI, query API, and OTLP-HTTP trace ingest on 6006.
  # No healthcheck: the integration-test fixture retries the connection instead.
  phoenix:
    image: arizephoenix/phoenix:version-15.11.0
    ports:
      - "6007:6006"

  # OpenSearch single-node with the security plugin disabled (http, no auth) to
  # match the other backends; remapped to 9201 to avoid a local clash. No
  # healthcheck: the integration-test fixture retries the connection instead.
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      bootstrap.memory_lock: "false"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9201:9200"

  # Milvus standalone plus its etcd and minio dependencies. Heavier than the
  # other backends, so it is gated behind the `milvus` profile and excluded from
  # the default `docker compose up`; run it locally with:
  #   docker compose --profile milvus up -d
  # etcd and minio stay internal (no published ports); only Milvus is exposed.
  # No healthcheck: the integration-test fixture retries the connection instead.
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.16
    profiles: ["milvus"]
    command:
      - etcd
      - --advertise-client-urls=http://milvus-etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"

  milvus-minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: ["milvus"]
    command: minio server /minio_data
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin

  milvus:
    image: milvusdb/milvus:v2.5.4
    profiles: ["milvus"]
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - milvus-etcd
      - milvus-minio
