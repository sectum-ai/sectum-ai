# Local backends for Sectum AI integration tests.
# Usage: docker compose up -d   (then `uv run pytest`)
name: sectum

services:
  pgvector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: sectum
      POSTGRES_PASSWORD: sectum
      POSTGRES_DB: sectum
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sectum -d sectum"]
      interval: 2s
      timeout: 3s
      retries: 30

  # No healthcheck: the chroma image lacks a reliable in-container probe, so the
  # integration-test fixture retries the connection instead.
  chroma:
    image: chromadb/chroma:1.5.9
    ports:
      - "8001:8000"
