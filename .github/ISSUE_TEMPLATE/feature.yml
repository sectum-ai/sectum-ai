name: Feature request
description: Propose an enhancement to Sectum AI.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Sectum AI has a deliberately narrow scope (the engineering spec, sections 1.3 and 20).
        Proposals are evaluated against that scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What verification gap or user problem does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
