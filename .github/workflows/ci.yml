name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type-check (mypy strict)
        run: uv run mypy

      # CONTRIBUTING tells a contributor to run these hooks, and nothing here ran
      # them: codespell was red on a clean checkout for months, and so was
      # end-of-file-fixer (it rewrote five checked-in evidence packs). Running the
      # whole hook set is the only version that stays true as hooks are added.
      # `--show-diff-on-failure` prints what a hook would have rewritten, since a
      # formatting hook "fails" by editing rather than by saying anything.
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Tests
        run: uv run pytest -n auto --cov=sectum_ai --cov-report=term-missing

      # Per-package floors (the engineering spec, §15): core, probes, and evidence
      # must each stay at or above 85% line coverage. Reuses the .coverage written
      # by the Tests step; fails the build if any package regresses below the bar.
      - name: Coverage floors (core / probes / evidence >= 85%)
        run: |
          for pkg in core probes evidence; do
            echo "::group::coverage floor: $pkg"
            uv run coverage report --include="packages/$pkg/src/*" --fail-under=85
            echo "::endgroup::"
          done

      - name: Example walkthroughs (e2e)
        run: |
          set -euo pipefail
          # `pytest -m e2e` exits 0 when the whole file SKIPS for a missing
          # SECTUM_RUN_E2E, so one lost env line would stop every walkthrough
          # while the job stayed green. Both sibling steps assert this already.
          uv run pytest -m e2e -q | tee /tmp/e2e.log
          grep -qE "[1-9][0-9]* passed" /tmp/e2e.log || {
            echo "::error::no e2e walkthrough ran - all skipped (SECTUM_RUN_E2E unset?)"
            exit 1
          }
        env:
          SECTUM_RUN_E2E: "1"

  extras-contract:
    name: Extras API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages

      # The lint-type-test job installs no extras, so every live adapter behind
      # one is unreachable there and a bump to its package goes green having run
      # none of the code it could break. Install the packages whose API surface
      # tests/contract/test_extra_api_surface.py pins so that file executes.
      #
      # Versions come from `uv export`, i.e. what the LOCKFILE resolves, not the
      # newest on PyPI, so the contract reflects what a user of the extra gets.
      # Installed directly rather than via `uv sync --extra huggingface`, which
      # would also pull torch and the NVIDIA CUDA wheels (~GBs) that signature
      # and attribute inspection does not need.
      - name: Install the pinned extras (locked versions, no torch)
        run: |
          # GitHub's default `run:` shell has -e but NOT -o pipefail, so a grep
          # that matched nothing exited 0 through the pipe, installed nothing,
          # and the contract tests below all skipped while the job passed.
          set -euo pipefail
          uv export --all-extras --no-hashes --no-emit-project > /tmp/all-reqs.txt
          grep -E '^(cohere|huggingface-hub|transformers|peft|openai|anthropic|langfuse)==' /tmp/all-reqs.txt \
            | tee /tmp/extras-reqs.txt
          uv pip install -r /tmp/extras-reqs.txt

      - name: Extras API contract
        run: |
          set -euo pipefail
          # `pytest` exits 0 when every test SKIPS for a missing import, so the
          # job passed while checking no API surface at all. Assert they ran.
          uv run --no-sync pytest tests/contract/test_extra_api_surface.py -v \
            | tee /tmp/extras.log
          grep -qE "[1-9][0-9]* passed" /tmp/extras.log || {
            echo "::error::no extras contract test ran - every one skipped (extras not installed?)"
            exit 1
          }

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run gitleaks
        # gitleaks-action@v2 requires a paid/registration-gated license for
        # organization repos; the gitleaks binary itself is MIT-licensed.
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks dir . --no-banner --redact

  integration:
    name: Integration (docker-compose backends)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages

      # pgvector and redis ship in-container healthchecks, so --wait blocks until
      # they are ready. chroma, weaviate, phoenix, qdrant, and opensearch do not,
      # so they are started separately and gated by an HTTP readiness poll below —
      # without it their fixtures would silently *skip* (not fail) and the surface
      # would go untested while the job still passed. (Milvus is gated behind the
      # `milvus` profile and not started here; its integration test skips in CI.)
      - name: Start backends with healthchecks
        run: docker compose up -d --wait pgvector redis

      - name: Start HTTP backends
        run: docker compose up -d chroma weaviate phoenix qdrant opensearch

      - name: Wait for HTTP backends to be ready
        run: |
          wait_for() {
            local name="$1" url="$2"
            for _ in $(seq 1 90); do
              if curl -sSf -o /dev/null "$url"; then echo "ready: $name"; return 0; fi
              sleep 2
            done
            echo "::error::$name not ready after 180s ($url)"
            return 1
          }
          wait_for chroma     http://localhost:8001/api/v2/heartbeat
          wait_for weaviate   http://localhost:8082/v1/.well-known/ready
          wait_for phoenix    http://localhost:6007/healthz
          wait_for qdrant     http://localhost:6335/readyz
          wait_for opensearch http://localhost:9201/_cluster/health

      - name: Integration tests
        run: |
          set -euo pipefail
          # `pytest -m integration` exits 0 when every test SKIPS for an
          # unreachable backend, so the job passed while testing nothing. Assert
          # that tests actually ran.
          uv run pytest -m integration -q | tee /tmp/integration.log
          grep -qE "[1-9][0-9]* passed" /tmp/integration.log || {
            echo "::error::no integration test ran - every one skipped (backends unreachable?)"
            exit 1
          }

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100

      - name: Stop backends
        if: always()
        run: docker compose down -v
