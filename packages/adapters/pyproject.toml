[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sectum-ai-adapters"
version = "0.8.2"
description = "Sectum AI - adapters connecting the substrate and probes to real systems."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Sectum AI" }]
keywords = ["ai-security", "multi-tenant", "adapters", "verification"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "sectum-ai-spec",
    # base.py imports pydantic directly (adapter config models); declare it
    # rather than relying on the transitive dependency via sectum-ai-spec (§13).
    "pydantic>=2.9",
]

[project.optional-dependencies]
pgvector = ["psycopg[binary]>=3.3.4"]
chroma = ["chromadb-client>=0.5"]
weaviate = ["weaviate-client>=4.9"]
redis = ["redis>=5"]
# capped below 0.2: mem0 is pre-1.0 and its next line drops user_id/limit from
# Memory.search (swallowed by **kwargs), which would silently run recall UNSCOPED.
mem0 = ["mem0ai>=0.1,<0.2"]
# the Phoenix adapter imports httpx directly (observability/phoenix.py); declare
# it explicitly rather than relying on arize-phoenix-client to pull it in.
phoenix = ["arize-phoenix-client>=2", "httpx>=0.27"]
langfuse = ["langfuse>=4.14.0,<5"]
langsmith = ["langsmith>=0.1"]
mcp = ["mcp>=1"]
pinecone = ["pinecone>=5"]
qdrant = ["qdrant-client>=1.12"]
milvus = ["pymilvus>=2.4"]
opensearch = ["opensearch-py>=2.4"]
azure-search = ["azure-search-documents>=11.4", "azure-core>=1.30"]
langgraph = ["langgraph>=1.2.10", "langchain-core>=0.3"]
autogen = ["pyautogen>=0.2,<0.3"]
crewai = ["crewai>=1.15.1"]
huggingface = ["transformers>=5.14.1", "peft>=0.20.0", "torch>=2.4", "accelerate>=1"]
# vLLM is reached over its OpenAI-compatible HTTP API, so the client SDK is the
# only dependency (not the GPU-heavy vllm package itself).
vllm = ["openai>=1.50"]
# TGI is reached over its native text-generation API via the huggingface_hub
# InferenceClient (not the GPU-heavy text-generation-inference server package).
tgi = ["huggingface_hub>=1.26.1"]
openai-assistants = ["openai>=1.50"]
anthropic-tooluse = ["anthropic>=0.40"]
rag-langchain = ["langchain-core>=0.3"]
# the S3 backup adapter talks to any S3-compatible store (AWS S3, MinIO, Ceph);
# langsmith (above) also backs the eval-set adapter (LangSmith Datasets).
boto3 = ["boto3>=1.43.51"]
# the GCS backup adapter is the Google-cloud parallel of the S3 one (fake-gcs-server
# for local testing via STORAGE_EMULATOR_HOST).
gcs = ["google-cloud-storage>=2.10"]
# helicone + datadog observability read over their REST APIs with the standard
# library (no SDK), so they need no extras group; listed here for discoverability.

[project.urls]
Homepage = "https://sectum.ai"
Repository = "https://github.com/sectum-ai/sectum-ai"

[tool.uv.sources]
sectum-ai-spec = { workspace = true }

[tool.hatch.build.targets.wheel]
only-include = ["src/sectum_ai"]
sources = ["src"]
