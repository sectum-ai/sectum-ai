[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sectum-ai-probes"
version = "0.1.0"
description = "Sectum AI - the multi-tenant leakage attack catalog (probe classes)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Sectum AI" }]
keywords = ["ai-security", "multi-tenant", "red-team", "verification"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "sectum-ai-spec",
]

[project.urls]
Homepage = "https://sectum.ai"
Repository = "https://github.com/sectum-ai/sectum-ai"

[tool.uv.sources]
sectum-ai-spec = { workspace = true }

[tool.hatch.build.targets.wheel]
only-include = ["src/sectum"]
sources = ["src"]
