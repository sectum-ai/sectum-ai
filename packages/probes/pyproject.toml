[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sectum-ai-probes"
version = "0.1.3"
description = "Sectum AI - the multi-tenant leakage attack catalog (probe classes)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Sectum AI" }]
keywords = ["ai-security", "multi-tenant", "red-team", "verification"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "sectum-ai-spec",
    # erasure/probe.py and kv_cache_timing/probe.py import sectum_ai.adapters at module
    # load (eagerly, via probes/__init__), so a published sectum-ai-probes must
    # declare it rather than rely on the adapters sibling being co-installed. The
    # edge is acyclic: sectum-ai-adapters imports only sectum_ai.spec (ADR-0004).
    "sectum-ai-adapters",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://sectum.ai"
Repository = "https://github.com/sectum-ai/sectum-ai"

[tool.uv.sources]
sectum-ai-spec = { workspace = true }
sectum-ai-adapters = { workspace = true }

[tool.hatch.build.targets.wheel]
only-include = ["src/sectum_ai"]
sources = ["src"]
