[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sectum-ai-evidence"
version = "0.0.0"
description = "Sectum AI - tamper-evident evidence chain, verification, and audit-pack rendering."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Sectum AI" }]
keywords = ["ai-security", "evidence", "attestation", "audit", "verification"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "sectum-ai-spec",
    "reportlab>=4",
]

[project.optional-dependencies]
# RFC 3161 trusted timestamping. Optional: the default LocalTimestamper has no
# third-party dependency, and `sectum verify` only needs this to check an
# RFC 3161 token. CVE-2025-52556 was fixed in 1.0.3.
rfc3161 = ["rfc3161-client>=1.0.3"]

[project.urls]
Homepage = "https://sectum.ai"
Repository = "https://github.com/sectum-ai/sectum-ai"

[tool.uv.sources]
sectum-ai-spec = { workspace = true }

[tool.hatch.build.targets.wheel]
only-include = ["src/sectum"]
sources = ["src"]
