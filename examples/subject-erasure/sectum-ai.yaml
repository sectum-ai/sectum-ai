# A small corpus for a fast, deterministic demo. `erasure --subject` verifies the
# configured adapters; the default here is the built-in synthetic store, so this
# demo reports ABSENCE CHECKED with a "no live adapter" warning - the A3 path scans
# only AFTER the controller's deletion, so it never establishes a pre-erasure
# baseline and ERASED is not a verdict it can reach. Point vector_store at a real
# backend to verify production data (and to catch residual).
scenario:
  seed: 2026
  corpus_size: 24
