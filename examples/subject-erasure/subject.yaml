records:
  vector_db: ["doc-a1b2", "doc-c3d4"]
  semantic_cache: ["qa:7f3e", "qa:1b09"]
fingerprints:
  vector_db: ["Dana Lin", "dana.lin@example.com"]
  model_adapter: ["Dana Lin"] # probe a per-tenant fine-tune for residual memorization
