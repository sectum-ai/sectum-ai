# Sectum AI - uv workspace root.
#
# This is a virtual workspace root: it has no [project] table and is not itself
# a publishable package. It ties the packages/* distributions together for
# development and holds shared tooling configuration.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-xdist>=3",
    "pre-commit>=4.0",
    "psycopg[binary]>=3.3.4",
    "chromadb-client>=0.5",
    "weaviate-client>=4.21.3",
    "qdrant-client>=1.12",
    "opensearch-py>=2.4",
    "redis>=5",
    "arize-phoenix-client>=2",
    "mcp>=1",
    "types-pyyaml>=6",
    "hypothesis>=6.155.1",
    "rfc3161-client>=1.0.3",
    "cryptography>=43",
]
docs = [
    "mkdocs-material>=9.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "SIM",     # flake8-simplify
    "TID",     # flake8-tidy-imports
    "PTH",     # flake8-use-pathlib
    "RUF",     # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["sectum_ai"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "packages/core/src",
    "packages/spec/src",
    "packages/probes/src",
    "packages/adapters/src",
    "packages/evidence/src",
]
files = [
    "packages/core/src",
    "packages/spec/src",
    "packages/probes/src",
    "packages/adapters/src",
    "packages/evidence/src",
    "tests",
]
pretty = true

[[tool.mypy.overrides]]
# Treat the chromadb client as opaque: its embedding-argument types are far
# stricter than this adapter needs, and the adapter's own API is fully typed.
module = ["chromadb", "chromadb.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# reportlab and weasyprint ship no type information; treat them as opaque.
module = ["reportlab", "reportlab.*", "weasyprint", "weasyprint.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional embedding providers (the sentence-transformers / openai extras): not
# installed in the default env and ship no/partial stubs. Treat as opaque; the
# embeddings module's own API is fully typed.
module = ["sentence_transformers", "sentence_transformers.*", "openai", "openai.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# redis-py's command return types are broad runtime unions; treat the client
# as opaque - the Redis adapter's own API is fully typed.
module = ["redis", "redis.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# weaviate-client types its sync methods with return unions that also cover the
# async client; treat the package as opaque - the adapter's own API is typed.
module = ["weaviate", "weaviate.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# the pinecone client is an optional, live-only dependency; treat it as opaque
# so the adapter type-checks without it installed (the adapter's API is typed).
module = ["pinecone", "pinecone.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# the qdrant client is an optional, live-only dependency; treat it as opaque
# so the adapter type-checks without it installed (the adapter's API is typed).
module = ["qdrant_client", "qdrant_client.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# the milvus client (pymilvus) is an optional, live-only dependency; treat it as
# opaque so the adapter type-checks without it installed (the adapter's API is typed).
module = ["pymilvus", "pymilvus.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# the opensearch client is an optional, live-only dependency; treat it as opaque
# so the adapter type-checks without it installed (the adapter's API is typed).
module = ["opensearchpy", "opensearchpy.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# the Azure AI Search SDK is an optional, live-only (cloud) dependency; treat it
# as opaque so the adapter type-checks without it installed (the adapter's API is typed).
module = ["azure.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# the langfuse client is an optional, live-only dependency; treat it as opaque
# so the adapter type-checks without it installed (the adapter's API is typed).
module = ["langfuse", "langfuse.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# huggingface_hub (the TGI adapter's InferenceClient) is an optional, live-only
# dependency; treat it as opaque so the adapter type-checks without it installed.
module = ["huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# the langsmith client is an optional, live-only dependency; treat it as opaque
# so the adapter type-checks without it installed (the adapter's API is typed).
module = ["langsmith", "langsmith.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# boto3 (the S3 backup adapter) is an optional, live-only dependency; treat it as
# opaque so the adapter type-checks without it installed.
module = ["boto3", "boto3.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# mem0 (the mem0 memory adapter) is an optional, live-only dependency; treat it as
# opaque so the adapter type-checks without it installed.
module = ["mem0", "mem0.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# cohere / voyageai (the hosted RPR-sweep embedders) are optional, live-only
# dependencies; treat them as opaque so embeddings.py type-checks without them.
module = ["cohere", "cohere.*", "voyageai", "voyageai.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# the langgraph, langchain-core, and langchain-openai packages are optional,
# live-only dependencies; treat them as opaque so the adapter type-checks
# without them installed (the adapter's API is fully typed). langchain-openai
# is referenced only by the opt-in live integration test as an example model
# provider; the adapter itself is provider-agnostic.
module = [
    "langgraph",
    "langgraph.*",
    "langchain_core",
    "langchain_core.*",
    "langchain_openai",
    "langchain_openai.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# pyautogen is an optional, live-only dependency; treat it as opaque so the
# adapter type-checks without it installed (the adapter's API is fully typed).
module = ["autogen", "autogen.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# crewai is an optional, live-only dependency; treat it as opaque so the
# adapter type-checks without it installed (the adapter's API is fully typed).
module = ["crewai", "crewai.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# transformers / peft / torch / accelerate are optional, live-only
# dependencies; treat them as opaque so the adapter type-checks without
# them installed (the adapter's API is fully typed; the live PEFT backend
# only loads them on the connect path).
module = [
    "transformers",
    "transformers.*",
    "peft",
    "peft.*",
    "torch",
    "torch.*",
    "accelerate",
    "accelerate.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# openai is an optional, live-only dependency for the OpenAI Assistants
# agent adapter; treat it as opaque so the adapter type-checks without it
# installed (the adapter's API is fully typed; the live backend only loads
# the SDK on the connect path).
module = ["openai", "openai.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# anthropic is an optional, live-only dependency for the Anthropic native
# tool-use agent adapter; treat it as opaque so the adapter type-checks
# without it installed (the adapter's API is fully typed; the live backend
# only loads the SDK on the connect path).
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# rfc3161-client ships a Rust extension whose stubs expose broad return types;
# treat it as opaque - the Rfc3161Timestamper's own API is fully typed.
module = ["rfc3161_client", "rfc3161_client.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
markers = [
    "integration: requires docker-compose backends (see tests/integration)",
    "live: requires live cloud credentials; skipped unless explicitly enabled",
    "e2e: runs the example walkthroughs end to end; set SECTUM_RUN_E2E=1",
]

[tool.coverage.run]
branch = true
# parallel: each pytest-xdist worker writes its own .coverage.<pid>.<random>
# shard; pytest-cov combines them at the end. Also keeps the serial path
# correct (one shard becomes one combined .coverage file).
parallel = true
source = ["sectum_ai"]
# Live adapters are exercised by docker-backed integration tests, not the unit
# suite; exclude them so the gate measures unit-tested code.
omit = [
    "*/sectum_ai/adapters/vector/*",
    "*/sectum_ai/adapters/cache/*",
    "*/sectum_ai/adapters/memory/*",
    "*/sectum_ai/adapters/observability/*",
    "*/sectum_ai/adapters/search_index/*",
    "*/sectum_ai/adapters/eval_set/*",
    "*/sectum_ai/adapters/backup/*",
    # The live vLLM / TGI backends talk to a server via their client SDKs; they
    # are exercised by env-gated integration tests, like the other live adapters.
    "*/sectum_ai/adapters/model/_vllm_live.py",
    "*/sectum_ai/adapters/model/_tgi_live.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.codespell]
ignore-words-list = "sectum"
skip = ".git,.venv,uv.lock"
